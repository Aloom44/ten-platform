version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: alam_alwan_mysql
    restart: always
    environment:
      MYSQL_DATABASE: alam_alwan_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: alamuser
      MYSQL_PASSWORD: alampassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend
    container_name: alam_alwan_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=alam_alwan_db
      - DB_USER=alamuser
      - DB_PASSWORD=alampassword
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      - db

volumes:
  mysql_data:
